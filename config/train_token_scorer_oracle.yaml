# Counterfactual-retention TokenScorer training.

oracle_shards:
  - /path/to/mount/lyj/voxel-vggt/checkpoints/token_oracle/oracle_shard_000.pt

output: /path/to/mount/lyj/voxel-vggt/checkpoints/token_scorer_oracle/token_scorer.pt
score_state_proj_checkpoint: null

score_state_dim: 128
hidden_dim: 256
num_layers: 24
batch_size: 64
epochs: 5
lr: 1e-4
regression_weight: 0.1
min_loss_gap: 0.01

task_weights:
  camera: 20.0
  depth: 20.0
  point_map: 10.0
