# GT-supervised frontend fine-tuning WITH streaming cache — FULL TRAINING
# Multi-GPU (4×GPU 4-7), 6 confirmed datasets (indoor-heavy), 1 epoch.
# FrontendSupervisedLoss (GT targets) + production cache (ring0.2+budget8334+intra ON).

pretrained: /path/to/mount/lyj/voxel-vggt/ckpt/checkpoints.pth
resume: null
benchmark: False

frontend_mode: frontend_train
frontend_pose_encoding_type: relT_quaR_FoV
frontend_per_layer_budget: 8334
frontend_camera_budget: 384
anchor_overflow_policy: global_plus_recent
fixed_length: True
allow_repeat: True

# === PRODUCTION CACHE CONFIG ===
frontend_cache:
  enabled: true
  dedup_enabled: true
  intra_frame_dedup_enabled: true
  intra_dedup_mode: drop
  fifo_keep_topk: 80
  fifo_protected_ring_ratio: 0.2
  max_protected_ratio: 1.0
  budget_allocation: uniform
  eviction_importance_weight: 0.5
  voxel_size: 0.1

num_views: 16
train_aug_crop: 16
n_corres_train: 0
train_criterion: FrontendSupervisedLoss()

train_resolutions: "[(518, 392), (518, 336), (518, 294), (518, 266), (518, 210), (518, 154), (392, 518), (336, 518), (294, 518), (266, 518)]"
train_transform: SeqColorJitter
data_root: /path/to/mount/lyj

# 6 confirmed-available datasets, indoor-heavy weighting (ScanNet++/HyperSim closest to 7-Scenes)
dataset_co3d: Co3d_Multi(allow_repeat=${allow_repeat}, split='train', ROOT='${data_root}/co3d_processed', aug_crop=${train_aug_crop}, resolution=${train_resolutions}, transform=${train_transform}, num_views=${num_views}, n_corres=${n_corres_train})
dataset_wildrgbd: WildRGBD_Multi(allow_repeat=${allow_repeat}, split='train', ROOT='${data_root}/processed_wildrgbd', aug_crop=${train_aug_crop}, resolution=${train_resolutions}, transform=${train_transform}, num_views=${num_views}, n_corres=${n_corres_train})
dataset_scannetpp: ScanNetpp_Multi(allow_repeat=${allow_repeat}, split='train', ROOT='${data_root}/processed_scannetpp', aug_crop=${train_aug_crop}, resolution=${train_resolutions}, transform=${train_transform}, num_views=${num_views}, n_corres=${n_corres_train})
dataset_hypersim: HyperSim_Multi(allow_repeat=${allow_repeat}, split='train', ROOT='${data_root}/hypersim_processed', aug_crop=${train_aug_crop}, resolution=${train_resolutions}, transform=${train_transform}, num_views=${num_views}, n_corres=${n_corres_train})
dataset_blendedmvs: BlendedMVS_Multi(allow_repeat=${allow_repeat}, split='train', ROOT='${data_root}/blendedmvs_processed', aug_crop=${train_aug_crop}, resolution=${train_resolutions}, transform=${train_transform}, num_views=${num_views}, n_corres=${n_corres_train})
dataset_megadepth: MegaDepth_Multi(allow_repeat=${allow_repeat}, split='train', ROOT='${data_root}/processed_megadepth', aug_crop=${train_aug_crop}, resolution=${train_resolutions}, transform=${train_transform}, num_views=${num_views}, n_corres=${n_corres_train})

# Indoor-heavy: ScanNet++ (indoor) + HyperSim (indoor synth) weighted highest
train_dataset: 500 @ ${dataset_scannetpp} + 400 @ ${dataset_hypersim} + 400 @ ${dataset_blendedmvs} + 250 @ ${dataset_co3d} + 250 @ ${dataset_wildrgbd} + 200 @ ${dataset_megadepth}

num_test_views: 4
test_dataset: 100 @ BlendedMVS_Multi(allow_repeat=False, split='train', ROOT='${data_root}/blendedmvs_processed', resolution=(518, 392), num_views=${num_test_views}, seed=42, n_corres=0)

seed: 0
batch_size: 1
accum_iter: 2
gradient_checkpointing: True
ddp_static_graph: False
ddp_find_unused_parameters: True
frontend_head_checkpointing: True
epochs: 1
start_epoch: 0
start_step: 0
weight_decay: 0.05
lr: 1e-5
min_lr: 1e-7
warmup_epochs: 0.5
amp: 1

use_token_scorer: False
use_count_head: False
finetune_full_model: True

num_workers: 8
world_size: 4
local-rank: -1
dist_url: env://
rank: 0
gpu: 0
distributed: True
dist_backend: nccl

save_freq: 1
keep_freq: 1
save_iter_freq: 0
keep_iter_freq: 0
print_freq: 10
print_img_freq: 50000000
save_dir: /path/to/mount/lyj/voxel-vggt/checkpoints
exp_name: OVGGT_gt_ddp_last4_1e5
task: OVGGT_frontend
logdir: ${save_dir}/${exp_name}/logs
output_dir: ${save_dir}/${exp_name}/
hydra:
  verbose: True
  run:
    dir: ${save_dir}/${exp_name}
freeze_strategy: last4
