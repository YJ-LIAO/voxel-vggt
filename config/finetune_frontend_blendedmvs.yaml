teacher: Null
pretrained: /mnt/lyj/workspace/OVGGT-main/checkpoints/OVGGT_frontend_custom_b1_nv24_memopt/model.pth
resume: Null
auto_resume: True
benchmark: False

frontend_mode: frontend_train
frontend_pose_encoding_type: relT_quaR_FoV
frontend_total_budget: 10410
frontend_camera_budget: 128
anchor_overflow_policy: global_plus_recent
fixed_length: True
allow_repeat: False

num_views: 24
n_corres_train: 0
train_criterion: FrontendSupervisedLoss()

dataset: BlendedMVSContinuous_Multi(allow_repeat=${allow_repeat}, split='train', ROOT="/mnt/lyj/workspace/StreamVGGT/dataset/blendedmvs_processed/",
  contiguous_step=1, aug_crop=16,
  resolution=[(518, 392), (518, 336), (518, 294), (518, 266), (518, 210), (518, 154), (392, 518), (336, 518), (294, 518), (266, 518)],
  transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})

train_dataset: 2250 @ ${dataset}
val_dataset: Null

seed: 0
batch_size: 1
accum_iter: 4
gradient_checkpointing: True
ddp_static_graph: True
ddp_find_unused_parameters: False
activation_offload_cpu: False
epochs: 5
start_epoch: 0
start_step: 0
weight_decay: 0.05
lr: 1e-5
min_lr: 1e-7
warmup_epochs: 0.5
amp: 1
eval_freq: 0
eval_max_batches: 0
force_eval_on_last_epoch: True

num_workers: 4
world_size: 4
local-rank: -1
dist_url: env://
rank: 0
gpu: 0
distributed: True
dist_backend: nccl

save_freq: 1
keep_freq: 1
save_iter_freq: 500
keep_iter_freq: 0
print_freq: 10
print_img_freq: 50000000
save_dir: /mnt/lyj/workspace/OVGGT-main/checkpoints
exp_name: OVGGT_frontend_stage_b_supervised
task: OVGGT_frontend
logdir: ${save_dir}/${exp_name}/logs
output_dir: ${save_dir}/${exp_name}/
hydra:
  verbose: True
  run:
    dir: ${save_dir}/${exp_name}
