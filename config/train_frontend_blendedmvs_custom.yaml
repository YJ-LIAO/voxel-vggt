# Frontend训练配置 - 多分辨率版本
# GPU: 4-7号卡，多GPU训练

# teacher: /mnt/lyj/workspace/OVGGT-main/ckpt/model.pt
teacher: /mnt/lyj/workspace/OVGGT-main/ckpt/checkpoints.pth
pretrained: /mnt/lyj/workspace/OVGGT-main/ckpt/checkpoints.pth
resume: Null
auto_resume: True
benchmark: False

frontend_mode: frontend_train
frontend_pose_encoding_type: relT_quaR_FoV
# KV cache budgets (sum over aggregator layers / camera trunk layers)
# 关键优化：大幅降低budget强制eviction，减少内存
# 10帧×1041tokens ≈ 10400
# 进一步收紧budget以降低显存峰值
frontend_total_budget: 10410
# frontend_camera_budget: 128

# Anchor overflow strategy when cache_budget cannot fit all anchors:
# - recent: keep most recent anchors
# - global_plus_recent: keep global anchor + most recent anchors
anchor_overflow_policy: recent
fixed_length: True
allow_repeat: False

num_views: 32
n_corres_train: 0
train_criterion: FrontendDistillLoss()

# 多分辨率数据增强
dataset: BlendedMVSContinuous_Multi(allow_repeat=${allow_repeat}, split='train', ROOT="/mnt/lyj/workspace/OVGGT-main/blendedmvs_processed/",
  contiguous_step=1, aug_crop=16,
  resolution=[(518, 392), (518, 336), (518, 294), (518, 266), (518, 210), (518, 154), (392, 518), (336, 518), (294, 518), (266, 518)],
  transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train})

train_dataset: 2250 @ ${dataset}
val_dataset: Null

seed: 0
batch_size: 1
accum_iter: 4
gradient_checkpointing: True  # 使用模型内checkpoint，降低显存且尽量保持GPU训练
ddp_static_graph: True  # DDP静态图，兼容checkpoint重算与固定训练图
ddp_find_unused_parameters: False  # Stage A无track分支时关闭unused参数遍历，减少DDP开销
frontend_head_checkpointing: True  # 打开DPT头重算，降低student depth/point head峰值显存
activation_offload_cpu: False  # 关闭CPU offload，避免拖慢训练
teacher_output_to_cpu: True  # teacher target落CPU，student loss按需回传到GPU
teacher_weight_offload: True  # teacher仅在推理阶段驻留GPU，释放backward阶段显存
teacher_empty_cache: False  # 不在每步强制empty_cache，保留allocator复用以提升速度

# Teacher model config (OVGGT Legacy mode)
# VGGT processes all frames at once -> OOM with 24 frames
# OVGGT Legacy processes frames sequentially -> ~70% memory reduction
teacher_total_budget: 200000  # Large budget for teacher, no eviction needed
epochs: 5
start_epoch: 0
start_step: 0
weight_decay: 0.05
lr: 1e-5
min_lr: 1e-7
warmup_epochs: 0.5
amp: 1
eval_freq: 0
eval_max_batches: 0
force_eval_on_last_epoch: True

num_workers: 4
world_size: 4
local-rank: -1
dist_url: env://
rank: 0
gpu: 0
distributed: True
dist_backend: nccl

save_freq: 1
keep_freq: 1
save_iter_freq: 500
keep_iter_freq: 0
print_freq: 10
print_img_freq: 50000000
save_dir: /mnt/lyj/workspace/OVGGT-main/checkpoints
exp_name: OVGGT_frontend_custom_b1_nv24_memopt
task: OVGGT_frontend
logdir: ${save_dir}/${exp_name}/logs
output_dir: ${save_dir}/${exp_name}/
hydra:
  verbose: True
  run:
    dir: ${save_dir}/${exp_name}
